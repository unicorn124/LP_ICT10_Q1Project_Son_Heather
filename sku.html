 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKU Generator - Skewer</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
         body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRrEMSTHk9w_QqN8ZkXLNowww7Hlrkfmg9n8ziqE732XnXHoCt6VQWPLhux&s=10); 
            background-size: cover;          
            background-position: center;     
            background-repeat: no-repeat;    
            background-attachment: fixed;    
        }

        .navbar {
            width: 100%;
            margin: 0;
            border-radius: 0;
        }

       
        .main-card {
            background: white;
            width: 90%;
            max-width: 440px;
            margin: 40px auto;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        
        .card-header-custom {
            background: linear-gradient(135deg, #4879f3 0%, #74cdf0  100%);
            color: white;
            text-align: center;
            padding: 24px 16px;
        }

        .card-header-custom .icon {
            font-size: 24px;
            margin-bottom: 4px;
        }

       
        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #444;
            margin-bottom: 4px;
        }

        .form-control, .form-select {
            border-radius: 8px;
            border: 1px solid #dee2e6;
            padding: 10px 12px;
            font-size: 14px;
        }

        .btn-create {
            width: 100%;
            background: linear-gradient(90deg,  #5093f9, #140155 );
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            transition: opacity 0.2s;
        }

        .btn-create:hover {
            opacity: 0.92;
            color: white;
        }

        .sku-display {
            background-color: #f8f9fa;
            border: 2px dashed #d63384;
            border-radius: 8px;
            padding: 14px;
            text-align: center;
        }

</style>
</head>
<body>


<nav class="navbar navbar-expand navbar-dark bg-dark">
<div class="container-fluid px-4">
<a class="navbar-brand fw-bold" href="index.html">Skewer</a>
<div class="navbar-nav ms-auto">
<a class="nav-link" href="index.html">Receipt Generator</a>
 <a class="nav-link active" href="sku.html">SKU Generator</a></div>
</div>
</nav>


<div class="main-card">

<div class="card-header-custom">
<div class="icon">💎</div>
<h2 class="h4 fw-bold mb-0">SKU Generator</h2>
</div>

<div class="card-body p-4">
<form id="skuForm">

<div class="mb-3">
<div class="icon">💙</div>
<label for="category" class="form-label">Category</label>
<select id="category" class="form-select" required>
<option value="" selected disabled>Select Category</option>
<option value="BEA">Beauty / Cosmetics</option>
<option value="LIP">Lip Care</option>
<option value="SKI">Skin Care</option></select></div>


<div class="mb-3">
<div class="icon">💙</div>
<label for="productName" class="form-label"> Product Name</label>
<input type="text" id="productName" class="form-control" placeholder="e.g. Blue Lipstick" required>
</div>


<div class="mb-3">
<div class="icon">💙</div>
<label for="stockQuantity" class="form-label">Stock Quantity</label>
<input type="number" id="stockQuantity" class="form-control" placeholder="e.g. 50" min="1" required>
</div>

<button type="button" class="btn btn-create mt-2" onclick="generateSKU()">Generate SKU</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>


</html>
