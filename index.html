<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> DIAMOND BEAUTY STORE</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRrEMSTHk9w_QqN8ZkXLNowww7Hlrkfmg9n8ziqE732XnXHoCt6VQWPLhux&s=10); 
            background-size: cover;          
            background-position: center;     
            background-repeat: no-repeat;    
            background-attachment: fixed;     

        }

        
        .navbar {
            width: 100%;
            margin: 0;
            border-radius: 0;
            background-color: #1e252b;
        }

        
        .main-card {
            background: white;
            width: 90%;
            max-width: 440px;
            margin: 40px auto;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        
        .card-header-custom {
            background: linear-gradient(135deg, #4879f3 0%, #74cdf0 100%);
            color: white;
            text-align: center;
            padding: 24px 16px;
        }

        .card-header-custom .icon {
            font-size: 28px;
            margin-bottom: 4px;
        }

       
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border: 1px solid #eef2f7;
            border-radius: 8px;
            margin-bottom: 8px;
            transition: background 0.2s;
        }

        .menu-item:hover {
            background-color: #fcf8fa;
        }

       
        .btn-create {
            width: 100%;
            background: linear-gradient(90deg, #5093f9, #140155);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            transition: opacity 0.2s;
        }

        .btn-create:hover {
            opacity: 0.92;
            color: white;
        }
</style>
</head>
<body>

<nav class="navbar navbar-expand navbar-dark">
<div class="container-fluid px-4">
<a class="navbar-brand fw-bold" href="index.html">Skewer</a>
<div class="navbar-nav ms-auto">
<a class="nav-link active" href="index.html">Receipt Generator</a>
<a class="nav-link" href="sku.html">SKU Generator</a></div></div>
</nav>


<div class="main-card">

<div class="card-header-custom">
<div class="icon">💎</div>
<h2 class="h5 fw-bold mb-1"> DIAMOND BEAUTY STORE</h2>
</div>


<div class="card-body p-4">
<h6 class="fw-bold mb-3 text-secondary">≡ Menu</h6>
<form id="orderForm">
<div class="menu-item"><div>
<input type="checkbox" id="item1" class="form-check-input me-2" data-name="Lipsticks" data-price="100">
<label for="item1" class="fw-semibold">Lipsticks</label></div>
<span class="fw-bold text-primary">₱100</span></div>

<div class="menu-item"> <div>
<input type="checkbox" id="item2" class="form-check-input me-2" data-name="Blush-on" data-price="150">
<label for="item2" class="fw-semibold">Blush-on</label></div>
<span class="fw-bold text-primary">₱150</span></div>

<div class="menu-item">
 <div>
<input type="checkbox" id="item3" class="form-check-input me-2" data-name="Foundation" data-price="200">
<label for="item3" class="fw-semibold">Foundation</label>
</div>
 <span class="fw-bold text-primary">₱200</span>
</div>

<div class="menu-item"> <div>
<input type="checkbox" id="item4" class="form-check-input me-2" data-name="Eye Shadows" data-price="300">
<label for="item4" class="fw-semibold">Eye Shadows</label>
</div>
<span class="fw-bold text-primary">₱300</span>
</div>

<div class="menu-item"> <div>
<input type="checkbox" id="item5" class="form-check-input me-2" data-name="Nail Polish" data-price="80">
<label for="item5" class="fw-semibold">Nail Polish</label>
</div>
<span class="fw-bold text-primary">₱80</span></div>

<button type="button" class="btn btn-create mt-3" onclick="createReceipt()"> Create Order
</button>
</form>

<div class="text-center text-muted small mt-4 pt-3 border-top border-dashed" id="receiptSummary"> Your order summary will appear here.
</div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
